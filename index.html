<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Colico Restobar - Menú Digital Mobile</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #15181e;
      --primary: #f1b812;
      --primary-hover: #d4a00e;
      --text-main: #f0f2f5;
      --text-muted: #9aa0a6;
      --border-color: #2a2f38;
      --wsp-green: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    /* HEADER APP BAR */
    .app-header {
      background: rgba(21, 24, 30, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
    }

    .brand-title {
      text-align: center;
      margin-bottom: 12px;
    }

    .brand-title h1 {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--primary);
      text-transform: uppercase;
      font-style: italic;
    }

    .brand-title p {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 2px;
    }

    /* BARRA DE BÚSQUEDA */
    .search-box {
      position: relative;
      margin-bottom: 10px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background-color: #0b0c10;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-box .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* CATEGORÍAS TIPO CHIPS */
    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: #1f242d;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    /* CONTENEDOR DE PRODUCTOS */
    .container {
      padding: 12px 16px;
    }

    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* TARJETA DE PRODUCTO */
    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-img-container {
      position: relative;
      width: 100%;
      height: 160px;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: bold;
      border: 1px solid var(--primary);
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
    }

    .ingredients {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* SELECCIÓN DE PORCIONES */
    .portions-container {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .portion-btn {
      flex: 1;
      background: #0b0c10;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      color: var(--text-main);
    }

    .portion-btn.selected {
      border-color: var(--primary);
      background: rgba(241, 184, 18, 0.1);
    }

    .portion-name {
      display: block;
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .portion-price {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--primary);
    }

    .btn-add {
      width: 100%;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 800;
      font-size: 0.85rem;
      margin-top: 6px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-add:active {
      background: var(--primary-hover);
    }

    /* BOTTOM BAR (RESUMEN DEL CARRITO) */
    .bottom-cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1e26;
      border-top: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 90;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
    }

    .cart-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-badge {
      background: var(--primary);
      color: #000;
      font-weight: 900;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .cart-total {
      display: flex;
      flex-direction: column;
    }

    .cart-total span {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .cart-total strong {
      font-size: 1.1rem;
      color: #fff;
    }

    .btn-view-cart {
      background: var(--wsp-green);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* MODAL / BOTTOM SHEET CARRITO */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 200;
      display: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      display: block;
      opacity: 1;
    }

    .cart-modal {
      position: fixed;
      bottom: -100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px 16px;
      z-index: 201;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      transition: bottom 0.3s ease-out;
    }

    .cart-modal.active {
      bottom: 0;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-header h3 {
      font-size: 1.1rem;
      color: #fff;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items-list {
      overflow-y: auto;
      max-height: 250px;
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b0c10;
      padding: 10px;
      border-radius: 8px;
    }

    .cart-item-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
    }

    .cart-item-sub {
      font-size: 0.75rem;
      color: var(--primary);
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-qty {
      background: #2a2f38;
      border: none;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .table-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #0b0c10;
      color: #fff;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }

    .btn-send-wsp {
      width: 100%;
      background: var(--wsp-green);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- HEADER FIJO -->
  <header class="app-header">
    <div class="brand-title">
      <h1>COLICO RESTOBAR</h1>
      <p>CUNCO • ARAUCANÍA</p>
    </div>

    <!-- BUSCADOR -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="input-search" placeholder="Buscar papas, empanadas...">
    </div>

    <!-- FILTROS POR CATEGORÍA -->
    <div class="categories-scroll">
      <button class="chip active" onclick="filtrarCategoria('TODOS', this)">Todos</button>
      <button class="chip" onclick="filtrarCategoria('BOX PAPAS', this)">Box Papas</button>
      <button class="chip" onclick="filtrarCategoria('EMPANADAS', this)">Empanadas</button>
      <button class="chip" onclick="filtrarCategoria('BEBIDAS', this)">Bebidas</button>
    </div>
  </header>

  <!-- LISTA DE PRODUCTOS -->
  <main class="container">
    <div class="menu-grid" id="menu-container">
      <!-- Tarjetas cargadas vía Javascript -->
    </div>
  </main>

  <!-- BARRA INFERIOR FLOTANTE -->
  <div class="bottom-cart-bar" id="bottom-bar" style="display: none;">
    <div class="cart-info">
      <div class="cart-badge" id="cart-count">0</div>
      <div class="cart-total">
        <span>Total estimado</span>
        <strong id="cart-total-price">$0</strong>
      </div>
    </div>
    <button class="btn-view-cart" onclick="abrirModal()">
      Ver Pedido 🛒
    </button>
  </div>

  <!-- MODAL / BOTTOM SHEET CARRITO -->
  <div class="modal-overlay" id="modal-overlay" onclick="cerrarModal()"></div>
  <div class="cart-modal" id="cart-modal">
    <div class="modal-header">
      <h3>Tu Pedido</h3>
      <button class="btn-close" onclick="cerrarModal()">&times;</button>
    </div>

    <div class="cart-items-list" id="cart-items-container">
      <!-- Items agregados -->
    </div>

    <input type="text" id="mesa-input" class="table-input" placeholder="N° de Mesa o Dirección de Entrega (Opcional)">

    <button class="btn-send-wsp" onclick="enviarPedidoWhatsApp()">
      Enviar Pedido por WhatsApp 📲
    </button>
  </div>

  <script>
    // NÚMERO DE TELÉFONO DE RECEPCIÓN (Modificar aquí)
    const NUMERO_WHATSAPP = "56912345678";

    // BASE DE DATOS DE PRODUCTOS
    const productosBD = [
      {
        id: 1,
        categoria: "BOX PAPAS",
        nombre: "Playa La Isla",
        ingredientes: "Papas fritas crujientes con aderezo de la casa",
        imagen: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500&q=80",
        porciones: [
          { nombre: "1-2 Personas", precio: 3500 },
          { nombre: "3-4 Personas", precio: 5500 }
        ]
      },
      {
        id: 2,
        categoria: "BOX PAPAS",
        nombre: "Playa Hogar",
        ingredientes: "Papas fritas con salchichas sureñas en rodajas",
        imagen: "https://images.unsplash.com/photo-1585109649139-366815a0d713?w=500&q=80",
        porciones: [
          { nombre: "1-2 Personas", precio: 4000 },
          { nombre: "3-4 PERSONAS", precio: 6500 }
        ]
      },
      {
        id: 3,
        categoria: "BOX PAPAS",
        nombre: "Ponciano Castro",
        ingredientes: "Papas fritas, tocino crocante y queso cheddar derretido",
        imagen: "https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?w=500&q=80",
        porciones: [
          { nombre: "1-2 Personas", precio: 5500 },
          { nombre: "3-4 Personas", precio: 10000 }
        ]
      },
      {
        id: 4,
        categoria: "EMPANADAS",
        nombre: "Empanadas de Queso",
        ingredientes: "Empanadas de queso frito artesanal",
        imagen: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=500&q=80",
        porciones: [
          { nombre: "6 Unidades", precio: 4000 },
          { nombre: "12 Unidades", precio: 8000 }
        ]
      }
    ];

    let carrito = [];
    let seleccionesPorcion = {}; // Guarda qué porción eligió el usuario en cada tarjeta

    // INICIALIZAR RENDER
    function renderProductos(lista) {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      if (lista.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted); margin-top:20px;">No se encontraron productos.</p>';
        return;
      }

      lista.forEach(prod => {
        // Inicializar porción por defecto (la primera)
        if (seleccionesPorcion[prod.id] === undefined) {
          seleccionesPorcion[prod.id] = 0;
        }

        const indexSel = seleccionesPorcion[prod.id];

        const card = document.createElement('div');
        card.className = 'product-card';

        let porcionesHTML = prod.porciones.map((p, idx) => `
          <div class="portion-btn ${idx === indexSel ? 'selected' : ''}" onclick="seleccionarPorcion(${prod.id}, ${idx})">
            <span class="portion-name">${p.nombre}</span>
            <span class="portion-price">$${p.precio.toLocaleString('es-CL')}</span>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="card-img-container">
            <img src="${prod.imagen}" alt="${prod.nombre}">
            <span class="badge-tag">${prod.categoria}</span>
          </div>
          <div class="card-body">
            <h2 class="product-title">${prod.nombre}</h2>
            <p class="ingredients">${prod.ingredientes}</p>
            <div class="portions-container">
              ${porcionesHTML}
            </div>
            <button class="btn-add" onclick="agregarAlCarrito(${prod.id})">
              Agregar al Pedido 🛒
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // CAMBIAR SELECCIÓN DE PORCIÓN
    function seleccionarPorcion(prodId, indexPorcion) {
      seleccionesPorcion[prodId] = indexPorcion;
      aplicarFiltros();
    }

    // AGREGAR AL CARRITO
    function agregarAlCarrito(prodId) {
      const prod = productosBD.find(p => p.id === prodId);
      const porcionIndex = seleccionesPorcion[prodId];
      const porcion = prod.porciones[porcionIndex];

      const itemExistente = carrito.find(item => item.id === prodId && item.porcionNombre === porcion.nombre);

      if (itemExistente) {
        itemExistente.cantidad++;
      } else {
        carrito.push({
          id: prod.id,
          nombre: prod.nombre,
          porcionNombre: porcion.nombre,
          precio: porcion.precio,
          cantidad: 1
        });
      }

      actualizarUI();
    }

    // ACTUALIZAR INTERFAZ Y BARRA
    function actualizarUI() {
      const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
      const precioTotal = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

      document.getElementById('cart-count').textContent = totalItems;
      document.getElementById('cart-total-price').textContent = `$${precioTotal.toLocaleString('es-CL')}`;

      const bottomBar = document.getElementById('bottom-bar');
      bottomBar.style.display = totalItems > 0 ? 'flex' : 'none';

      renderCarritoItems();
    }

    // RENDER ITEMS DENTRO DEL MODAL
    function renderCarritoItems() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';

      carrito.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div>
            <div class="cart-item-title">${item.nombre}</div>
            <div class="cart-item-sub">${item.porcionNombre} • $${(item.precio * item.cantidad).toLocaleString('es-CL')}</div>
          </div>
          <div class="cart-item-controls">
            <button class="btn-qty" onclick="cambiarCantidad(${index}, -1)">-</button>
            <span style="color:#fff; font-size:0.85rem;">${item.cantidad}</span>
            <button class="btn-qty" onclick="cambiarCantidad(${index}, 1)">+</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function cambiarCantidad(index, delta) {
      carrito[index].cantidad += delta;
      if (carrito[index].cantidad <= 0) {
        carrito.splice(index, 1);
      }
      actualizarUI();
      if (carrito.length === 0) cerrarModal();
    }

    // FILTROS Y BÚSQUEDA
    let categoriaActual = 'TODOS';

    function filtrarCategoria(cat, btn) {
      categoriaActual = cat;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      aplicarFiltros();
    }

    document.getElementById('input-search').addEventListener('input', aplicarFiltros);

    function aplicarFiltros() {
      const texto = document.getElementById('input-search').value.toLowerCase();

      const filtrados = productosBD.filter(p => {
        const cumpleCat = categoriaActual === 'TODOS' || p.categoria === categoriaActual;
        const cumpleTexto = p.nombre.toLowerCase().includes(texto) || p.ingredientes.toLowerCase().includes(texto);
        return cumpleCat && cumpleTexto;
      });

      renderProductos(filtrados);
    }

    // MODAL
    function abrirModal() {
      document.getElementById('modal-overlay').classList.add('active');
      document.getElementById('cart-modal').classList.add('active');
    }

    function cerrarModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      document.getElementById('cart-modal').classList.remove('active');
    }

    // ENVIAR POR WHATSAPP
    function enviarPedidoWhatsApp() {
      if (carrito.length === 0) return;

      const mesaInfo = document.getElementById('mesa-input').value.trim();
      let mensaje = "🍟 *NUEVO PEDIDO - COLICO RESTOBAR*\n\n";

      if (mesaInfo) {
        mensaje += `📍 *Ubicación/Mesa:* ${mesaInfo}\n\n`;
      }

      mensaje += "📋 *Detalle del Pedido:*\n";
      let total = 0;

      carrito.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        mensaje += `• ${item.cantidad}x *${item.nombre}* (${item.porcionNombre}) - $${subtotal.toLocaleString('es-CL')}\n`;
      });

      mensaje += `\n💰 *TOTAL A PAGAR:* $${total.toLocaleString('es-CL')}\n\n`;
      mensaje += "Quedo a la espera de la confirmación.";

      const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }

    // INICIO
    renderProductos(productosBD);
  </script>
</body>
</html>
