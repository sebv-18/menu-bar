<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colico Restobar - Menú Digital</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Firebase App (Base) y Firestore -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary-color: #ff9800;
      --primary-hover: #e68900;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --accent-color: #272727;
      --fire-color: #ff4757;
      --btn-green: #2ed573;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 100px;
    }

    header {
      background: linear-gradient(135deg, #1f1f1f, #121212);
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid var(--primary-color);
    }

    header h1 {
      color: var(--primary-color);
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .search-container {
      padding: 15px 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-container input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 25px;
      border: 1px solid var(--accent-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    .search-container input:focus {
      border-color: var(--primary-color);
    }

    .categories-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px 20px 20px 20px;
      scrollbar-width: none;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--accent-color);
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .cat-btn.active, .cat-btn:hover {
      background-color: var(--primary-color);
      color: #000;
      border-color: var(--primary-color);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--accent-color);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card-img-container {
      width: 100%;
      height: 160px;
      overflow: hidden;
      background-color: #2a2a2a;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 15px;
    }

    .card-body h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .card-body p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .size-selector {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .size-btn {
      background: var(--bg-color);
      border: 1px solid var(--accent-color);
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .size-btn.selected {
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .card-footer {
      padding: 15px;
      border-top: 1px solid var(--accent-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .add-btn {
      background-color: transparent;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .add-btn:hover {
      background-color: var(--primary-color);
      color: #000;
    }

    /* Floating Cart Bar */
    .floating-cart {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #1a1a1a;
      border-top: 2px solid var(--primary-color);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
      z-index: 100;
    }

    .cart-info {
      display: flex;
      flex-direction: column;
    }

    .cart-info span:first-child {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .cart-info span:last-child {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .checkout-btn {
      background-color: var(--btn-green);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Modal / Drawer de Pedido */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      overflow-y: auto;
      border-top: 2px solid var(--primary-color);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--accent-color);
      padding-bottom: 10px;
    }

    .modal-header h2 {
      font-size: 1.3rem;
      color: var(--primary-color);
    }

    .close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--accent-color);
      background-color: var(--bg-color);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .cart-items-summary {
      margin: 15px 0;
      max-height: 150px;
      overflow-y: auto;
      border-top: 1px dashed var(--accent-color);
      border-bottom: 1px dashed var(--accent-color);
      padding: 10px 0;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .send-whatsapp-btn {
      width: 100%;
      background-color: #25d366;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Colico Restobar</h1>
    <p>¡Haz tu pedido online de forma rápida!</p>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Busca tu plato o bebestible favorito..." oninput="filterMenu()">
  </div>

  <div class="categories-scroll">
    <button class="cat-btn active" onclick="filterCategory('todos', this)">Todos</button>
    <button class="cat-btn" onclick="filterCategory('burgers', this)">Hamburguesas</button>
    <button class="cat-btn" onclick="filterCategory('pizzas', this)">Pizzas</button>
    <button class="cat-btn" onclick="filterCategory('bebidas', this)">Bebidas</button>
  </div>

  <main class="container">
    <section id="menuGrid" class="grid">
      <!-- Los productos se cargarán dinámicamente desde Firestore -->
    </section>
  </main>

  <!-- Barra Flotante del Carrito -->
  <div class="floating-cart">
    <div class="cart-info">
      <span><span id="cartCount">0</span> productos</span>
      <span id="cartTotal">$0</span>
    </div>
    <button class="checkout-btn" onclick="openModal()">Ver Pedido</button>
  </div>

  <!-- Modal / Drawer para Finalizar Pedido -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Detalles de tu Pedido</h2>
        <button class="close-modal" onclick="closeModal()">&times;</button>
      </div>

      <div class="cart-items-summary" id="cartItemsList">
        <!-- Ítems del carrito se inyectan aquí -->
      </div>

      <div class="form-group">
        <label for="clientName">Tu Nombre:</label>
        <input type="text" id="clientName" placeholder="Ej: Juan Pérez">
      </div>

      <div class="form-group">
        <label for="orderType">Tipo de Pedido:</label>
        <select id="orderType" onchange="toggleAddressField()">
          <option value="Retiro en Local">Retiro en Local</option>
          <option value="Despacho a Domicilio">Despacho a Domicilio</option>
        </select>
      </div>

      <div class="form-group" id="addressGroup" style="display: none;">
        <label for="clientAddress">Dirección de Entrega:</label>
        <input type="text" id="clientAddress" placeholder="Calle, Número, Depto/Villa">
      </div>

      <button class="send-whatsapp-btn" onclick="sendWhatsAppOrder()">Enviar Pedido por WhatsApp 📲</button>
    </div>
  </div>

  <script>
    // Configuración de Firebase para tu proyecto
    const firebaseConfig = {
      apiKey: "AIzaSyDqJ6vXWssxZEPWc6v6oUbV-1QpLDla1A8",
      authDomain: "menu-c7a37.firebaseapp.com",
      projectId: "menu-c7a37",
      storageBucket: "menu-c7a37.appspot.com",
      messagingSenderId: "971482670586",
      appId: "1:971482670586:web:a91b95cb2f2917a2e807043",
      measurementId: "G-8Q7ZXZFT63"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let cart = [];
    let allProducts = [];

    // Cargar productos desde Firestore al iniciar la página
    document.addEventListener("DOMContentLoaded", () => {
      cargarMenuDesdeFirestore();
    });

    function cargarMenuDesdeFirestore() {
      const menuGrid = document.getElementById('menuGrid');
      menuGrid.innerHTML = '<p style="color:var(--text-muted); text-align:center; grid-column: span 2;">Cargando menú en tiempo real...</p>';

      db.collection("productos").onSnapshot((snapshot) => {
        allProducts = [];
        snapshot.forEach((doc) => {
          allProducts.push({ id: doc.id, ...doc.data() });
        });
        renderMenu(allProducts);
      }, (error) => {
        console.error("Error al cargar productos: ", error);
        menuGrid.innerHTML = '<p style="color:var(--fire-color); text-align:center; grid-column: span 2;">Error al cargar el menú desde la base de datos.</p>';
      });
    }

    function renderMenu(productos) {
      const menuGrid = document.getElementById('menuGrid');
      if (productos.length === 0) {
        menuGrid.innerHTML = '<p style="color:var(--text-muted); text-align:center; grid-column: span 2;">No hay productos disponibles aún.</p>';
        return;
      }

      let html = '';
      productos.forEach(prod => {
        let sizeButtonsHtml = '';
        let initialPrice = prod.precio;
        let initialSize = 'Único';

        if (prod.tamanios && prod.tamanios.length > 0) {
          initialPrice = prod.tamanios[0].precio;
          initialSize = prod.tamanios[0].nombre;
          prod.tamanios.forEach((t, index) => {
            const isSelected = index === 0 ? 'selected' : '';
            sizeButtonsHtml += `<button class="size-btn ${isSelected}" onclick="selectSize(this, ${t.precio}, '${t.nombre}')">${t.nombre}</button>`;
          });
        }

        html += `
          <article class="card" data-category="${prod.categoria}">
            <div class="card-img-container">
              <img src="${prod.imagen}" alt="${prod.nombre}">
            </div>
            <div class="card-body">
              <h3>${prod.nombre}</h3>
              <p>${prod.descripcion}</p>
              ${prod.tamanios && prod.tamanios.length > 0 ? `<div class="size-selector">${sizeButtonsHtml}</div>` : ''}
            </div>
            <div class="card-footer">
              <span class="price" data-current-price="${initialPrice}" data-size="${initialSize}">$${initialPrice.toLocaleString('es-CL')}</span>
              <button class="add-btn" onclick="addCardToCart(this)">+ Agregar</button>
            </div>
          </article>
        `;
      });
      menuGrid.innerHTML = html;
    }

    function addToCart(name, price, size) {
      cart.push({ name, price, size });
      updateCartUI();
    }

    function selectSize(btn, newPrice, sizeName) {
      const parent = btn.parentElement;
      parent.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');

      const card = btn.closest('.card');
      const priceTag = card.querySelector('.price');
      priceTag.innerText = '$' + newPrice.toLocaleString('es-CL');
      priceTag.dataset.currentPrice = newPrice;
      priceTag.dataset.size = sizeName;
    }

    function addCardToCart(btn) {
      const card = btn.closest('.card');
      const title = card.querySelector('h3').innerText;
      const priceTag = card.querySelector('.price');
      const currentPrice = parseInt(priceTag.dataset.currentPrice);
      const currentSize = priceTag.dataset.size || 'Único';

      addToCart(title, currentPrice, currentSize);
      
      const originalText = btn.innerText;
      btn.innerText = "✓ ¡Listo!";
      btn.style.backgroundColor = "var(--btn-green)";
      btn.style.color = "#fff";
      setTimeout(() => {
        btn.innerText = originalText;
        btn.style.backgroundColor = "transparent";
        btn.style.color = "var(--primary-color)";
      }, 800);
    }

    function updateCartUI() {
      let count = cart.length;
      let total = cart.reduce((sum, item) => sum + item.price, 0);

      document.getElementById('cartCount').innerText = count;
      document.getElementById('cartTotal').innerText = '$' + total.toLocaleString('es-CL');

      const listContainer = document.getElementById('cartItemsList');
      if (cart.length === 0) {
        listContainer.innerHTML = '<p style="font-size:0.8rem; color:var(--text-muted); text-align:center;">Tu carrito está vacío</p>';
        return;
      }

      let html = '';
      cart.forEach((item) => {
        html += `
          <div class="cart-item-row">
            <span>${item.name} (${item.size})</span>
            <span>$${item.price.toLocaleString('es-CL')}</span>
          </div>
        `;
      });
      listContainer.innerHTML = html;
    }

    function toggleAddressField() {
      const orderType = document.getElementById('orderType').value;
      const addressGroup = document.getElementById('addressGroup');
      if (orderType === 'Despacho a Domicilio') {
        addressGroup.style.display = 'block';
      } else {
        addressGroup.style.display = 'none';
        document.getElementById('clientAddress').value = '';
      }
    }

    function openModal() {
      if (cart.length === 0) {
        alert("Agrega productos al pedido antes de continuar.");
        return;
      }
      document.getElementById('orderModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('orderModal').classList.remove('active');
    }

    function sendWhatsAppOrder() {
      const name = document.getElementById('clientName').value.trim();
      const orderType = document.getElementById('orderType').value;
      const address = document.getElementById('clientAddress').value.trim();

      if (!name) {
        alert("Por favor ingresa tu nombre.");
        return;
      }

      if (orderType === 'Despacho a Domicilio' && !address) {
        alert("Por favor ingresa tu dirección de entrega.");
        return;
      }

      let total = cart.reduce((sum, item) => sum + item.price, 0);
      
      let message = `*¡Hola! Nuevo Pedido - Colico Restobar* 🍔🛵\n\n`;
      message += `👤 *Cliente:* ${name}\n`;
      message += `🛎️ *Modalidad:* ${orderType}\n`;
      if (orderType === 'Despacho a Domicilio') {
        message += `📍 *Dirección:* ${address}\n`;
      }
      message += `\n📋 *Detalle del Pedido:*\n`;

      cart.forEach(item => {
        message += `• ${item.name} [${item.size}] - $${item.price.toLocaleString('es-CL')}\n`;
      });

      message += `\n💰 *Total a Pagar:* $${total.toLocaleString('es-CL')}`;

      const phoneNumber = "56912345678"; // Cambia este número por el de tu local (con código de país)
      const encodedMessage = encodeURIComponent(message);
      window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
    }

    function filterCategory(category, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        if (category === 'todos' || card.dataset.category === category) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function filterMenu() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => {
        const title = card.querySelector('h3').innerText.toLowerCase();
        const desc = card.querySelector('p').innerText.toLowerCase();
        
        if (title.includes(input) || desc.includes(input)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
